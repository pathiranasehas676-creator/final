<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Readify | Random Recommender</title>
  <link rel="icon" href="favicon.ico">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/navbar.css">
  <link rel="stylesheet" href="css/footer.css">
  <link rel="stylesheet" href="css/recommender.css">
</head>
<body>
  <header class="navbar">
    <div class="container nav-container">
      <a class="logo" href="index.html">Readify</a>
      <button class="hamburger" aria-label="Toggle navigation" aria-expanded="false" aria-controls="primaryNav">
        <span></span>
        <span></span>
        <span></span>
      </button>
      <nav id="primaryNav" class="nav-links" aria-label="Primary">
        <a href="index.html">Home</a>
        <a href="explorer.html">Book Explorer</a>
        <a href="tracker.html">Progress Tracker</a>
        <a href="recommender.html">Random Recommender</a>
        <a href="flow.html">Reading Flow</a>
        <a href="feedback.html">Feedback</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <section class="reveal">
      <h1>Random Book Recommender</h1>
      <p>Pick your mood and get a surprise suggestion.</p>
    </section>

    <section class="recommender-grid reveal">
      <div class="card">
        <label>Genre
          <select id="recGenre">
            <option>All</option>
            <option>Fantasy</option>
            <option>Adventure</option>
            <option>Contemporary</option>
            <option>Science Fiction</option>
            <option>Mystery</option>
          </select>
        </label>
        <label>Length
          <select id="recLength">
            <option>All</option>
            <option>Short</option>
            <option>Medium</option>
            <option>Long</option>
          </select>
        </label>
        <button id="recommendBtn" class="btn btn-primary" type="button">Recommend</button>
        <button id="pickAgain" class="btn btn-secondary" type="button">Pick Again</button>
        <button id="saveRec" class="btn btn-secondary" type="button">Save to Reading List</button>
      </div>

      <div id="recommendationCard" class="card recommendation-card">
        <p>Select filters to see a recommendation.</p>
      </div>
    </section>

    <section class="reveal">
      <h2>Your Reading List</h2>
      <div id="readingListPreview" class="list-preview"></div>
    </section>
  </main>

  <footer class="footer">
    <div class="container footer-grid">
      <small>© 2026 Readify</small>
      <div class="footer-links">
        <a href="#">Privacy</a>
        <a href="#">Accessibility</a>
        <a href="https://github.com">GitHub</a>
      </div>
    </div>
  </footer>

  <button id="backToTop" class="back-to-top" aria-label="Back to top">↑</button>

  <script src="js/utils.js"></script>
  <script src="js/data.js"></script>
  <script src="js/navbar.js"></script>
  <script src="js/recommender.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('service-worker.js');
    }
  </script>
</body>
</html>
