<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Readify | Progress Tracker</title>
  <link rel="icon" href="favicon.ico">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/navbar.css">
  <link rel="stylesheet" href="css/footer.css">
  <link rel="stylesheet" href="css/tracker.css">
</head>
<body>
  <header class="navbar">
    <div class="container nav-container">
      <a class="logo" href="index.html">Readify</a>
      <button class="hamburger" aria-label="Toggle navigation" aria-expanded="false" aria-controls="primaryNav">
        <span></span>
        <span></span>
        <span></span>
      </button>
      <nav id="primaryNav" class="nav-links" aria-label="Primary">
        <a href="index.html">Home</a>
        <a href="explorer.html">Book Explorer</a>
        <a href="tracker.html">Progress Tracker</a>
        <a href="recommender.html">Random Recommender</a>
        <a href="flow.html">Reading Flow</a>
        <a href="feedback.html">Feedback</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <section class="reveal">
      <h1>Reading Progress Tracker</h1>
      <p>Enter your numbers to calculate progress and finish time.</p>
    </section>

    <section class="tracker-grid reveal">
      <form id="trackerForm" class="card">
        <label>Total Pages
          <input name="totalPages" type="number" min="1" required>
        </label>
        <label>Pages Read
          <input name="pagesRead" type="number" min="0" required>
        </label>
        <label>Reading Speed (pages/day)
          <input name="speed" type="number" min="1" required>
        </label>
        <button class="btn btn-primary" type="submit">Calculate</button>
        <button class="btn btn-secondary" type="button" id="saveProgress">Save Progress</button>
        <p id="saveStatus"></p>
      </form>

      <div class="card">
        <h2>Results</h2>
        <div class="counter" id="counter">0%</div>
        <p>Completed: <span id="percentComplete">0%</span></p>
        <div class="progress-bar">
          <div id="progressFill" class="progress-fill"></div>
        </div>
        <p id="finishEstimate"></p>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="container footer-grid">
      <small>© 2026 Readify</small>
      <div class="footer-links">
        <a href="#">Privacy</a>
        <a href="#">Accessibility</a>
        <a href="https://github.com">GitHub</a>
      </div>
    </div>
  </footer>

  <button id="backToTop" class="back-to-top" aria-label="Back to top">↑</button>

  <script src="js/utils.js"></script>
  <script src="js/navbar.js"></script>
  <script src="js/tracker.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('service-worker.js');
    }
  </script>
</body>
</html>
